name: Build OpenWrt x86-64

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: v25.12.4
  WORK_DIR: openwrt-src

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📦 环境初始化
        uses: actions/checkout@v4

      - name: 📥 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pyelftools python3-setuptools rsync subversion \
          swig time xsltproc zlib1g-dev p7zip-full jq wget curl unzip \
          qemu-utils

      - name: 🐙 获取 OpenWrt 源码
        run: git clone $OPENWRT_REPO -b $OPENWRT_BRANCH $WORK_DIR

      - name: 🔄 更新组件包 (Feeds)
        run: |
          cd $WORK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🛠️ 执行 DIY 脚本
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/scripts/diy.sh .
          bash diy.sh

      - name: 🔍 显示环境信息 (诊断)
        run: |
          echo "--- Node.js Version ---"
          node -v
          echo "--- Rustc Version ---"
          rustc --version || echo "Not installed"
          echo "--- qemu-img Version ---"
          qemu-img --version || echo "Not installed"

      - name: 📐 生成配置 (目标平台 + 自定义包)
        run: |
          cd $WORK_DIR
          #
          # ══════════════════════════════════════════════
          # 配置生成策略 (修复包缺失问题)
          # ══════════════════════════════════════════════
          # 
          # 问题: make defconfig 会丢弃 .config 中非目标默认的 CONFIG_PACKAGE_*
          # 解决: 先只用目标选项做 defconfig，再追加自定义包，最后 olddefconfig
          #
          echo "=== Step 1: 生成纯目标平台默认配置 ==="
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          make defconfig 2>&1
          echo "默认包: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config)"
          #
          echo "=== Step 2: 应用自定义设置 ==="
          # 禁用默认 dnsmasq
          sed -i 's/^CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          # 追加完整配置中的所有非目标行（即自定义包和设置）
          # 跳过: CONFIG_TARGET_*, CONFIG_GRUB_*, CONFIG_VMDK_*, 注释, 空行
          grep -v -E '^(CONFIG_TARGET_|CONFIG_GRUB_|CONFIG_VMDK_|#|$)' \
            ${{ github.workspace }}/configs/x86_64.config >> .config
          # 确保 feeds 开启
          for feed in CONFIG_FEED_packages CONFIG_FEED_luci CONFIG_FEED_routing CONFIG_FEED_telephony; do
            if ! grep -q "^${feed}=y" .config; then
              echo "${feed}=y" >> .config
            fi
          done
          #
          echo "=== Step 3: olddefconfig 解析依赖 (保留自定义包) ==="
          make olddefconfig 2>&1 || true
          #
          echo "=== Step 4: 验证所有关键包 ==="
          # 从 x86_64.config 中提取所有 CONFIG_PACKAGE_*=y
          grep -oP 'CONFIG_PACKAGE_\K[^=]+' ${{ github.workspace }}/configs/x86_64.config > /tmp/expected-pkgs.txt
          # 额外追加 MUST 清单中 x86_64.config 可能遗漏的包
          for extra in luci luci-base; do
            echo "$extra" >> /tmp/expected-pkgs.txt
          done
          sort -u /tmp/expected-pkgs.txt > /tmp/expected-pkgs-sorted.txt
          MISSING=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config 2>/dev/null; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg 缺失 — 强制写入"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
              ((MISSING++))
            fi
          done < /tmp/expected-pkgs-sorted.txt
          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ 强制写入了 $MISSING 个包，再运行 olddefconfig"
            make olddefconfig 2>&1 || true
            echo "=== 最终验证 ==="
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config 2>/dev/null; then
                echo "✅ $pkg"
              else
                echo "❌❌ $pkg 仍缺失 — 依赖不满足"
              fi
            done < /tmp/expected-pkgs-sorted.txt
          fi
          echo "=== 配置完成: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config) 个包 ==="

      - name: 📥 预下载编译依赖
        run: |
          cd $WORK_DIR
          unset CI
          make download -j$(nproc) || make download -j1 V=s

      - name: 🔨 核心编译阶段
        run: |
          cd $WORK_DIR
          unset CI
          make -j$(nproc) || make -j1 V=s

      - name: 📂 列出编译产物
        run: |
          echo "=== 编译产物列表 ==="
          ls -lh $WORK_DIR/bin/targets/x86/64/ || echo "目录不存在"

      - name: 📀 转换为 ESXi 兼容 VMDK
        run: |
          cd $WORK_DIR/bin/targets/x86/64/
          IMG_FILE=$(ls *combined-efi*.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            IMG_FILE=$(ls *combined-efi*.img.gz 2>/dev/null | head -1)
            if [ -n "$IMG_FILE" ]; then
              gunzip -k "$IMG_FILE"
              IMG_FILE="${IMG_FILE%.gz}"
            fi
          fi
          if [ -n "$IMG_FILE" ]; then
            VMDK_FILE="${IMG_FILE%.img}.vmdk"
            echo "🔄 转换: $IMG_FILE → $VMDK_FILE (ESXi streamOptimized)"
            qemu-img convert -O vmdk -o subformat=monolithicFlat "$IMG_FILE" "$VMDK_FILE"
            ls -lh "$VMDK_FILE"
          else
            echo "❌ 未找到 IMG 文件"
            exit 1
          fi

      - name: 📋 计算发布 Tag
        id: tag
        run: |
          RELEASE_TAG="v$(TZ='Asia/Shanghai' date '+%Y.%m.%d')-b${{ github.run_number }}"
          echo "tag_name=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "DEBUG: computed tag = ${RELEASE_TAG}"

      - name: 📦 发布固件至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "🐲 OpenWrt x86-64 Official"
          body: |
            - **Base**: `${{ env.OPENWRT_BRANCH }}`
            - **Address**: `192.168.80.80`
            - **OpenClash**: Meta Kernel
            - **dnsmasq-full** ✅ | **ZeroTier** ✅ | **KMS (vlmcsd)** ✅ | **中文 LuCI** ✅
          files: |
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*.vmdk
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
