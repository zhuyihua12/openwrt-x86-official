name: Build OpenWrt x86-64

on:
  schedule:
    - cron: '0 16 * * *'  # 北京时间 00:00
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: v25.12.1
  WORK_DIR: openwrt-src
  # 修正：适配 Node.js 24 运行环境，消除弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📦 环境初始化
        uses: actions/checkout@v4

      - name: 📥 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pyelftools python3-setuptools rsync subversion \
          swig time xsltproc zlib1g-dev p7zip-full jq wget curl unzip

      - name: 🐙 获取 OpenWrt 源码
        run: git clone $OPENWRT_REPO -b $OPENWRT_BRANCH $WORK_DIR

      - name: 🔄 更新组件包 (Feeds)
        run: |
          cd $WORK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🛠️ 执行 DIY 脚本
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/scripts/diy.sh .
          bash diy.sh

      - name: 🔍 显示环境信息 (诊断)
        run: |
          echo "--- Node.js Version ---"
          node -v
          echo "--- Rustc Version ---"
          rustc --version || echo "Not installed"

      - name: 📐 加载配置并补全 (defconfig)
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/configs/x86_64.config .config
          make defconfig

      - name: 📥 预下载编译依赖
        run: |
          cd $WORK_DIR
          # 核心修复：移除 GitHub Actions 的 CI 环境变量，防止 Rust 编译脚本进入严格模式
          unset CI
          make download -j$(nproc) || make download -j1 V=s

      - name: 🔨 核心编译阶段
        run: |
          cd $WORK_DIR
          # 核心修复：同样在编译阶段移除 CI 环境变量
          unset CI
          make -j$(nproc) || make -j1 V=s

      - name: 📦 发布固件至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(TZ='Asia/Shanghai' date '+%Y.%m.%d')-b${{ github.run_number }}
          name: 🛡️ OpenWrt x86-64 官方纯净版
          body: |
            - **基础版本**: `${{ env.OPENWRT_BRANCH }}`
            - **管理地址**: `192.168.80.80`
            - **内核版本**: OpenClash Meta v1.19.0
          files: |
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*.vmdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
