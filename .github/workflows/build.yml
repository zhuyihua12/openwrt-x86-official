name: Build OpenWrt x86-64

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: v25.12.3
  WORK_DIR: openwrt-src

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📦 环境初始化
        uses: actions/checkout@v4

      - name: 📥 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pyelftools python3-setuptools rsync subversion \
          swig time xsltproc zlib1g-dev p7zip-full jq wget curl unzip \
          qemu-utils

      - name: 🐙 获取 OpenWrt 源码
        run: git clone $OPENWRT_REPO -b $OPENWRT_BRANCH $WORK_DIR

      - name: 🔄 更新组件包 (Feeds)
        run: |
          cd $WORK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🛠️ 执行 DIY 脚本
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/scripts/diy.sh .
          bash diy.sh

      - name: 🔍 显示环境信息 (诊断)
        run: |
          echo "--- Node.js Version ---"
          node -v
          echo "--- Rustc Version ---"
          rustc --version || echo "Not installed"
          echo "--- qemu-img Version ---"
          qemu-img --version || echo "Not installed"

      - name: 📐 加载配置并补全 (defconfig)
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/configs/x86_64.config .config
          make defconfig

      - name: 🔒 强制锁定所有自定义包选项
        run: |
          cd $WORK_DIR
          echo "=== 强制写入自定义包选项（defconfig 后） ==="
          # DNS: 禁用普通 dnsmasq，启用 dnsmasq-full
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dhcp=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dnssec=y" >> .config

          # 中文语言包
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-admin-full-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-system-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-status-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-network-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y" >> .config

          # ZeroTier + LuCI 界面 + 中文
          echo "CONFIG_PACKAGE_zerotier=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-zerotier=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-zerotier-zh-cn=y" >> .config

          # KMS (vlmcsd) + LuCI 界面 + 中文
          echo "CONFIG_PACKAGE_vlmcsd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-vlmcsd=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y" >> .config

          # 其他应用
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          # OpenClash + 依赖
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config

          # 确保 dnsmasq-full 的 deps 不会因为冲突被清掉
          make olddefconfig 2>/dev/null || true

          echo "=== 验证关键包选项 ==="
          for pkg in dnsmasq-full luci-i18n-base-zh-cn zerotier luci-app-zerotier vlmcsd luci-app-vlmcsd; do
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg 丢失！"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            fi
          done

      - name: 📥 预下载编译依赖
        run: |
          cd $WORK_DIR
          unset CI
          make download -j$(nproc) || make download -j1 V=s

      - name: 🔨 核心编译阶段
        run: |
          cd $WORK_DIR
          unset CI
          make -j$(nproc) || make -j1 V=s

      - name: 📂 列出编译产物
        run: |
          echo "=== 编译产物列表 ==="
          ls -lh $WORK_DIR/bin/targets/x86/64/ || echo "目录不存在"

      - name: 📀 转换为 ESXi 兼容 VMDK
        run: |
          cd $WORK_DIR/bin/targets/x86/64/
          # 找到 IMG 文件
          IMG_FILE=$(ls *combined-efi*.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            IMG_FILE=$(ls *combined-efi*.img.gz 2>/dev/null | head -1)
            if [ -n "$IMG_FILE" ]; then
              gunzip -k "$IMG_FILE"
              IMG_FILE="${IMG_FILE%.gz}"
            fi
          fi
          if [ -n "$IMG_FILE" ]; then
            VMDK_FILE="${IMG_FILE%.img}.vmdk"
            echo "🔄 转换: $IMG_FILE → $VMDK_FILE (ESXi streamOptimized)"
            qemu-img convert -O vmdk -o subformat=monolithicFlat "$IMG_FILE" "$VMDK_FILE"
            ls -lh "$VMDK_FILE"
          else
            echo "❌ 未找到 IMG 文件"
            exit 1
          fi

      - name: 📋 计算发布 Tag
        id: tag
        run: |
          RELEASE_TAG="v$(TZ='Asia/Shanghai' date '+%Y.%m.%d')-b${{ github.run_number }}"
          echo "tag_name=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "DEBUG: computed tag = ${RELEASE_TAG}"

      - name: 📦 发布固件至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "🐲 OpenWrt x86-64 Official"
          body: |
            - **Base**: `${{ env.OPENWRT_BRANCH }}`
            - **Address**: `192.168.80.80`
            - **OpenClash**: Meta Kernel
            - **dnsmasq-full** ✅ | **ZeroTier** ✅ | **KMS (vlmcsd)** ✅ | **中文 LuCI** ✅
          files: |
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*combined-efi*
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*combined-efi*.vmdk
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*combined*.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*rootfs*.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/*combined*.vmdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
