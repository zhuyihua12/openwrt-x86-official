name: Build OpenWrt x86-64

# 触发方式：仅由 check-update.yml 检测到新版后触发，或手动 workflow_dispatch。
# 追踪版本存于 configs/openwrt.version（不在本文件中，避免 GITHUB_TOKEN 无 workflows 权限无法自改）。
on:
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  WORK_DIR: openwrt-src

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📦 环境初始化
        uses: actions/checkout@v5

      - name: 📥 安装编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pyelftools python3-setuptools rsync subversion \
          swig time xsltproc zlib1g-dev p7zip-full jq wget curl unzip \
          qemu-utils

      - name: 🏷️ 读取追踪版本
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < configs/openwrt.version)
          if [ -z "$VER" ]; then echo "❌ configs/openwrt.version 为空"; exit 1; fi
          echo "OPENWRT_BRANCH=$VER" >> "$GITHUB_ENV"
          echo "本次编译基于: $VER"

      - name: 🐙 获取 OpenWrt 源码
        run: git clone $OPENWRT_REPO -b $OPENWRT_BRANCH $WORK_DIR

      - name: 🔄 更新组件包 (Feeds)
        run: |
          cd $WORK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🛠️ 执行 DIY 脚本
        run: |
          cd $WORK_DIR
          # 仓库 files/ 覆盖层（mosdns 配置/uci-defaults/firewall.user 等）合入构建根 files/
          mkdir -p files
          cp -r ${{ github.workspace }}/files/. ./files/
          echo "--- 覆盖层文件清单 ---"
          find files -type f | sort
          for f in files/etc/uci-defaults/zz-ipv6-mosdns files/etc/firewall.user; do
            [ -f "$f" ] || { echo "❌ 覆盖层缺文件: $f"; exit 1; }
          done
          grep -q "remote_dns='127.0.0.1:7874'" files/etc/uci-defaults/zz-ipv6-mosdns \
            || { echo "❌ uci-defaults 缺 mosdns remote_dns 分流键"; exit 1; }
          grep -q "dhcp.lan.ignore='1'" files/etc/uci-defaults/zz-ipv6-mosdns \
            || { echo "❌ uci-defaults 缺 LAN DHCP 忽略键"; exit 1; }
          echo "✅ 覆盖层完整"
          cp -f ${{ github.workspace }}/scripts/diy.sh .
          bash diy.sh

      - name: 🔍 显示环境信息 (诊断)
        run: |
          echo "--- Node.js Version ---"
          node -v
          echo "--- Rustc Version ---"
          rustc --version || echo "Not installed"
          echo "--- qemu-img Version ---"
          qemu-img --version || echo "Not installed"

      - name: 📐 生成配置 (目标平台 + 自定义包)
        run: |
          cd $WORK_DIR
          #
          # ══════════════════════════════════════════════
          # 配置生成策略 (修复包缺失问题)
          # ══════════════════════════════════════════════
          # 
          # 问题: make defconfig 会丢弃 .config 中非目标默认的 CONFIG_PACKAGE_*
          # 解决: 先只用目标选项做 defconfig，再追加自定义包，最后 olddefconfig
          #
          echo "=== Step 1: 生成纯目标平台默认配置 ==="
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          make defconfig 2>&1
          echo "默认包: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config)"
          #
          echo "=== Step 2: 应用自定义设置 ==="
          # 禁用默认 dnsmasq
          sed -i 's/^CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          # 追加完整配置中的所有非目标行（即自定义包和设置）
          # 跳过: CONFIG_TARGET_*, CONFIG_GRUB_*, CONFIG_VMDK_*, 注释, 空行
          grep -v -E '^(CONFIG_TARGET_|CONFIG_GRUB_|CONFIG_VMDK_|#|$)' \
            ${{ github.workspace }}/configs/x86_64.config >> .config
          # ttyd 需要 libwebsockets-full；默认 openssl/mbedtls 变体与其冲突，强制关闭
          sed -i 's/^CONFIG_PACKAGE_libwebsockets-openssl=y/# CONFIG_PACKAGE_libwebsockets-openssl is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_libwebsockets-mbedtls=y/# CONFIG_PACKAGE_libwebsockets-mbedtls is not set/' .config
          # rootfs 分区扩容：OpenClash(+ruby)/OpenSSL/lws-full 使 rootfs 超出默认 104MB
          # 注意: TARGET_ROOTFS_PARTSIZE 是 int 符号，不能带引号
          if grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=512/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> .config
          fi
          # 确保 feeds 开启
          for feed in CONFIG_FEED_packages CONFIG_FEED_luci CONFIG_FEED_routing CONFIG_FEED_telephony; do
            if ! grep -q "^${feed}=y" .config; then
              echo "${feed}=y" >> .config
            fi
          done
          #
          echo "=== Step 3: defconfig 解析依赖 (olddefconfig 在 v25.12 CI 下 broken-pipe，弃用) ==="
          make defconfig 2>&1 || { echo "=== defconfig 失败，-j1 V=s 重试 ==="; make defconfig -j1 V=s 2>&1 | tail -80; exit 1; }
          #
          echo "=== Step 4: 验证所有关键包 ==="
          # 从 x86_64.config 中提取所有 CONFIG_PACKAGE_*=y（仅行首有效行，避免把 "# CONFIG_PACKAGE_dnsmasq is not set" 注释行当包名）
          grep -E '^CONFIG_PACKAGE_[^=]+=y$' ${{ github.workspace }}/configs/x86_64.config \
            | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//' > /tmp/expected-pkgs.txt
          # 额外追加 MUST 清单中 x86_64.config 可能遗漏的包
          for extra in luci luci-base; do
            echo "$extra" >> /tmp/expected-pkgs.txt
          done
          sort -u /tmp/expected-pkgs.txt > /tmp/expected-pkgs-sorted.txt
          MISSING=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config 2>/dev/null; then
              echo "✅ $pkg"
            else
              echo "❌ $pkg 缺失 — 强制写入"
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
              MISSING=$((MISSING+1))
            fi
          done < /tmp/expected-pkgs-sorted.txt
          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ 强制写入了 $MISSING 个包，再运行 defconfig"
            make defconfig 2>&1 || true
            echo "=== 最终验证 ==="
            while IFS= read -r pkg; do
              [ -z "$pkg" ] && continue
              if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config 2>/dev/null; then
                echo "✅ $pkg"
              else
                echo "❌❌ $pkg 仍缺失 — 依赖不满足"
              fi
            done < /tmp/expected-pkgs-sorted.txt
          fi
          echo "=== 配置完成: $(grep -cE '^CONFIG_PACKAGE_.*=y' .config) 个包 ==="
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || { echo "❌ PARTSIZE 行丢失"; exit 1; }
          grep '^CONFIG_LUCI_LANG_zh_Hans=y' .config || { echo "❌ 中文语言开关未生效"; exit 1; }
          grep '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' .config || { echo "❌ zh-cn i18n 包未被联动启用"; exit 1; }

      - name: 📥 预下载编译依赖
        run: |
          cd $WORK_DIR
          unset CI
          make download -j$(nproc) || make download -j1 V=s

      - name: 🔨 核心编译阶段
        run: |
          cd $WORK_DIR
          unset CI
          make -j$(nproc) || make -j1 V=s

      - name: 📂 列出编译产物
        run: |
          echo "=== 编译产物列表 ==="
          ls -lh $WORK_DIR/bin/targets/x86/64/ || echo "目录不存在"
          echo "=== manifest 内容断言 ==="
          FOUND=0
          for m in $WORK_DIR/bin/targets/x86/64/*.manifest; do
            [ -f "$m" ] || continue
            FOUND=1
            FAIL=0
            for need in luci-i18n-base-zh-cn mosdns odhcp6c odhcpd; do
              if grep -q "^${need} " "$m" || grep -q "${need} -" "$m"; then
                echo "✅ $(basename "$m"): $need 已实装"
              else
                echo "❌ $(basename "$m"): 缺少 $need"
                FAIL=1
              fi
            done
            [ "$FAIL" = "0" ] || exit 1
          done
          [ "$FOUND" = "1" ] || { echo "❌ 无 manifest 可校验"; exit 1; }

      - name: 📀 转换为 ESXi 兼容 VMDK
        run: |
          cd $WORK_DIR/bin/targets/x86/64/
          IMG_FILE="openwrt-x86-64-generic-ext4-combined-efi.img"
          if [ ! -f "$IMG_FILE" ] && [ -f "${IMG_FILE}.gz" ]; then
            gunzip -k "${IMG_FILE}.gz"
          fi
          if [ -f "$IMG_FILE" ]; then
            VMDK_FILE="${IMG_FILE%.img}.vmdk"
            echo "🔄 转换: $IMG_FILE → $VMDK_FILE (单文件 monolithicSparse)"
            qemu-img convert -O vmdk -o subformat=monolithicSparse "$IMG_FILE" "$VMDK_FILE"
            ls -lh "$VMDK_FILE"
          else
            echo "❌ 未找到 $IMG_FILE"
            exit 1
          fi

      - name: 📋 计算发布 Tag
        id: tag
        run: |
          RELEASE_TAG="v$(TZ='Asia/Shanghai' date '+%Y.%m.%d')-b${{ github.run_number }}"
          echo "tag_name=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "DEBUG: computed tag = ${RELEASE_TAG}"

      - name: 📦 发布固件至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "🐲 OpenWrt x86-64 Official"
          body: |
            ### 🧩 单网口旁路由固件
            - **Base**: `${{ env.OPENWRT_BRANCH }}`（OpenWrt 官方纯净源码）
            - **接入**: 单网口接主路由 LAN，本机自动 DHCP 获取地址/网关/DNS（不提供 DHCP 服务）
            - **管理地址**: 主路由 DHCP 分配，终端列表中找主机名 `OpenWrt`
            - **DNS**: mosdns 前置分流（国内直连 / 代理域名走节点隧道，无 DNS 泄漏）；内置重写 `time.android.com → 203.107.6.88`
            - **OpenClash**: Meta 内核，已预置参数，导入节点即用
            - **IPv6**: v4+v6 地址/网关/DNS 全自动
            - **dnsmasq-full** ✅ | **ZeroTier** ✅ | **KMS (vlmcsd)** ✅ | **中文 LuCI** ✅
            > 使用文档见 README「旁路由接线」章节
          files: |
            ${{ env.WORK_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-ext4-combined-efi.img.gz
            ${{ env.WORK_DIR }}/bin/targets/x86/64/openwrt-x86-64-generic-ext4-combined-efi.vmdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
