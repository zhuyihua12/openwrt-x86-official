name: Build OpenWrt x86-64 Firmware

on:
  schedule:
    - cron: '0 16 * * *'  # 北京时间每日 00:00
  workflow_dispatch:
    inputs:
      debug_mode:
        description: '开启详细日志 (V=s)'
        required: false
        default: 'false'
        type: boolean

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: v25.12.1
  WORK_DIR: openwrt-src

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📦 清理工作空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/llvm
          sudo docker image prune -a -f

      - name: 📥 拉取项目配置 (含 configs/ 与 scripts/)
        uses: actions/checkout@v4

      - name: 📥 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pyelftools python3-setuptools rsync subversion \
          swig time xsltproc zlib1g-dev p7zip-full jq wget curl unzip

      - name: 🐙 克隆 OpenWrt 官方源码
        run: git clone $OPENWRT_REPO -b $OPENWRT_BRANCH $WORK_DIR

      - name: 🔄 更新 Feeds
        run: |
          cd $WORK_DIR
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 📦 注入自定义配置与脚本
        run: |
          cd $WORK_DIR
          cp -f ${{ github.workspace }}/configs/x86_64.config .config
          cp -f ${{ github.workspace }}/scripts/diy.sh diy.sh
          chmod +x diy.sh

      - name: 🛠️ 执行预处理 (diy.sh)
        run: cd $WORK_DIR &&bash diy.sh

      - name: 📐 生成最终配置
        run: cd $WORK_DIR && make defconfig

      - name: 📥 下载依赖包
        run: cd $WORK_DIR && make download -j$(nproc) || make download -j1 V=s

      - name: 🔨 编译固件
        run: |
          cd $WORK_DIR
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          if [[ "${{ inputs.debug_mode }}" == "true" ]]; then
            make -j1 V=s
          else
            make -j$(nproc)
          fi
          echo "DURATION=$(($(date +%s) - $START_TIME))" >> $GITHUB_ENV

      - name: 📦 整理输出文件
        run: |
          mkdir -p release
          BIN_DIR=$WORK_DIR/bin/targets/x86/64
          cp $BIN_DIR/openwrt-x86-64-generic-*.img.gz release/ 2>/dev/null || \
          cp $BIN_DIR/openwrt-x86-64-generic-*.img.gz release/openwrt-x86-64-combined.img.gz
          cp $BIN_DIR/openwrt-x86-64-generic-*.vmdk release/ 2>/dev/null || \
          cp $BIN_DIR/openwrt-x86-64-generic-*.vmdk release/openwrt-x86-64-combined.vmdk
          ls -lh release/

      - name: ☁️ 发布至 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(TZ='Asia/Shanghai' date '+%Y.%m.%d')-b${{ github.run_number }}
          name: 🛡️ OpenWrt x86-64 官方纯净版
          body: |
            ## 📦 版本信息
            - **基础版本**: `${{ env.OPENWRT_BRANCH }}`
            - **编译时长**: `${{ env.DURATION }}` 秒
            - **防火墙**: nftables (FW4)
            - **内核代理**: OpenClash Meta v1.19.0
            - **IPv6**: 🚫 已关闭
            - **DNS**: 🔍 Dnsmasq-full (冲突已修复)
            - **预装插件**: ZeroTier / vlmcsd-KMS / TTYD / FTP / SFTP / curl / htop / nano

            ## 📥 文件说明
            | 文件 | 用途 |
            |---|---|
            | `.img.gz` | 物理机/PVE/ESXi/Unraid 通用镜像 (推荐) |
            | `.vmdk`   | VMware Workstation/ESXi 直接导入 |
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
