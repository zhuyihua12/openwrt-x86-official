name: Auto Update OpenWrt Version

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00 = 北京时间 10:00
  workflow_dispatch:       # 支持手动触发

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  VERSION_FILE: configs/openwrt.version

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 🐙 检出仓库
        uses: actions/checkout@v5

      - name: 🏷️ 获取 OpenWrt 最新稳定版 tag
        id: latest
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags "$OPENWRT_REPO" \
            | grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | sed 's|refs/tags/||' \
            | sort -t. -k1.2 -n -k2 -n -k3 -n \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "❌ 未解析到任何稳定版 tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ 最新稳定版: ${TAG}"

      - name: 🔍 提取当前追踪版本 (configs/openwrt.version)
        id: current
        run: |
          CUR=$(tr -d '[:space:]' < "$VERSION_FILE")
          echo "branch=${CUR}" >> "$GITHUB_OUTPUT"
          echo "当前版本: ${CUR}"

      - name: ⏭️ 无须更新（已是最新版）
        if: steps.current.outputs.branch == steps.latest.outputs.tag
        run: echo "✅ 已是最新版本 ${{ steps.latest.outputs.tag }}，跳过更新"

      - name: 🔄 更新版本号文件
        if: steps.current.outputs.branch != steps.latest.outputs.tag
        run: |
          echo "${{ steps.latest.outputs.tag }}" > "$VERSION_FILE"
          echo "🔄 版本更新: ${{ steps.current.outputs.branch }} → ${{ steps.latest.outputs.tag }}"

      - name: 📝 提交变更
        if: steps.current.outputs.branch != steps.latest.outputs.tag
        run: |
          git config user.name "openwrt-auto-update[bot]"
          git config user.email "openwrt-auto-update[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "chore: bump OpenWrt to ${{ steps.latest.outputs.tag }}"
          git push

      - name: 🚀 触发新版本编译
        if: steps.current.outputs.branch != steps.latest.outputs.tag
        run: |
          gh workflow run build.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
