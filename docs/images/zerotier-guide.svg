<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'PingFang SC','Microsoft YaHei','Comic Sans MS',sans-serif">
  <defs>
    <clipPath id="typeclip1"><rect id="tc1" x="150" y="248" width="0" height="46"><animate attributeName="width" values="0;0;318;318" keyTimes="0;0.42;0.75;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="typeclip3"><rect id="tc3" x="118" y="250" width="0" height="30"><animate attributeName="width" values="0;0;175;175" keyTimes="0;0.4;0.7;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <path id="cursor" d="M0,0 L0,17 L4.5,13.5 L7.5,20 L10.5,18.5 L7.5,12 L13,11.5 Z" fill="#334155" stroke="#fff" stroke-width="1.2"/>
  </defs>

  <!-- ============ 场景 1：路由器加入网络 ============ -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.27;0.95;1" dur="24s" repeatCount="indefinite"/>
    <circle cx="52" cy="46" r="20" fill="#f6a821"/><text x="52" y="54" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="88" y="54" font-size="21" font-weight="bold" fill="#334155">路由器侧：服务 » ZeroTier，添加网络 ID</text>
    <!-- LuCI 面板 -->
    <rect x="70" y="86" width="500" height="330" rx="16" fill="#ffffff" stroke="#9aa7b5" stroke-width="2"/>
    <path d="M70,102 a16,16 0 0 1 16,-16 h468 a16,16 0 0 1 16,16 v36 h-500 Z" fill="#f6a821"/>
    <text x="92" y="115" font-size="18" font-weight="bold" fill="#fff">服务 (Services) » ZeroTier</text>
    <text x="92" y="160" font-size="14" fill="#5b6b7c">配置　|　网络状态　|　节点状态</text>
    <rect x="456" y="140" width="92" height="30" rx="8" fill="#f6a821"/>
    <text x="502" y="161" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">添加 +</text>
    <!-- 弹窗 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.42;1" dur="6s" repeatCount="indefinite"/>
      <rect x="118" y="180" width="404" height="196" rx="12" fill="#f5f9ff" stroke="#2ba7e8" stroke-width="2.5"/>
      <text x="140" y="212" font-size="16" font-weight="bold" fill="#2ba7e8">新网络 · New Network</text>
      <text x="140" y="244" font-size="15" fill="#334155">网络 ID（16 位十六进制）</text>
      <rect x="140" y="256" width="338" height="40" rx="8" fill="#fff" stroke="#9aa7b5" stroke-width="1.6"/>
      <text x="152" y="283" font-size="21" font-family="monospace" fill="#334155" clip-path="url(#typeclip1)">8056c2e21c000001</text>
      <rect x="152" y="262" width="2.5" height="28" fill="#f0605d">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="x" values="152;152;468;468" keyTimes="0;0.42;0.75;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="140" y="322" font-size="13.5" fill="#5b6b7c">✓ 启用　✓ 允许托管 IP/路由（保持默认）</text>
      <rect x="386" y="334" width="112" height="30" rx="8" fill="#2ba7e8">
        <animate attributeName="height" values="30;24;30" keyTimes="0;0.9;0.94" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="442" y="355" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">保存并应用</text>
    </g>
    <!-- 鼠标 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="300,300; 496,148; 496,148; 440,352; 440,352" keyTimes="0;0.28;0.33;0.86;1" dur="6s" repeatCount="indefinite"/>
      <use href="#cursor"/>
      <circle cx="2" cy="2" r="6" fill="none" stroke="#f0605d" stroke-width="2" opacity="0">
        <animate attributeName="r" values="4;18" dur="0.45s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="0.45s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;0;0;-12;0;0;0;-2;0" keyTimes="0;0.30;0.31;0.32;0.85;0.86;0.88;0.9;1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 机器人 -->
    <g transform="translate(700,230) scale(1.05)">
      <rect x="-38" y="-20" width="76" height="64" rx="16" fill="#2ba7e8"/>
      <circle cx="-15" cy="6" r="7" fill="#fff"/><circle cx="15" cy="6" r="7" fill="#fff"/>
      <circle cx="-13" cy="7" r="3" fill="#334155"/><circle cx="17" cy="7" r="3" fill="#334155"/>
      <path d="M-12,26 q12,10 24,0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="-40" stroke="#9aa7b5" stroke-width="4"/><circle cx="0" cy="-44" r="6" fill="#f0605d"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <rect x="-52" y="52" width="104" height="58" rx="10" fill="#fff" stroke="#9aa7b5" stroke-width="2"/>
      <text x="0" y="76" font-size="13" fill="#334155" text-anchor="middle">网络 ID 在哪拿？</text>
      <text x="0" y="96" font-size="13" font-weight="bold" fill="#7a3ff0" text-anchor="middle">my.zerotier.com</text>
    </g>
    <text x="700" y="405" font-size="14" fill="#5b6b7c" text-anchor="middle">注册账号 → My Networks → 创建网络</text>
  </g>

  <!-- ============ 场景 2：控制台授权 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.28;0.49;0.53;1" dur="24s" repeatCount="indefinite"/>
    <circle cx="52" cy="46" r="20" fill="#f6a821"/><text x="52" y="54" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="88" y="54" font-size="21" font-weight="bold" fill="#334155">控制台授权：勾选 Auth，别忘 Save</text>
    <rect x="70" y="86" width="780" height="330" rx="16" fill="#ffffff" stroke="#9aa7b5" stroke-width="2"/>
    <path d="M70,102 a16,16 0 0 1 16,-16 h748 a16,16 0 0 1 16,16 v34 h-780 Z" fill="#7a3ff0"/>
    <circle cx="96" cy="112" r="6" fill="#f0605d"/><circle cx="116" cy="112" r="6" fill="#f6a821"/><circle cx="136" cy="112" r="6" fill="#3ecf6f"/>
    <rect x="164" y="98" width="360" height="26" rx="13" fill="#efe6ff"/>
    <text x="180" y="116" font-size="14" fill="#7a3ff0">my.zerotier.com › Network › Members</text>
    <!-- 成员表 -->
    <text x="110" y="176" font-size="14" font-weight="bold" fill="#5b6b7c">MEMBER</text>
    <text x="360" y="176" font-size="14" font-weight="bold" fill="#5b6b7c">AUTH</text>
    <text x="470" y="176" font-size="14" font-weight="bold" fill="#5b6b7c">STATUS</text>
    <rect x="404" y="150" width="52" height="36" rx="8" fill="none" stroke="#f0605d" stroke-width="3" stroke-dasharray="6 5">
      <animate attributeName="stroke" values="#f0605d;#3ecf6f" keyTimes="0;0.6" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="110" y="222" font-size="17" font-family="monospace" fill="#334155">a0b1c2d3e4  (本机路由器)</text>
    <!-- 复选框切换 -->
    <rect x="416" y="202" width="24" height="24" rx="5" fill="#fff" stroke="#9aa7b5" stroke-width="2">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="428" cy="214" r="15" fill="#3ecf6f" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;19;15" keyTimes="0;0.62;0.68" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M420,214 l6,6 l10,-12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.64;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="470" y="222" font-size="17" font-weight="bold" fill="#f0605d" opacity="1">UNKNOWN
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.7;0.75;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="470" y="222" font-size="17" font-weight="bold" fill="#3ecf6f" opacity="0">READY ✓
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="6s" repeatCount="indefinite"/></text>
    <!-- 托管IP行 -->
    <text x="110" y="262" font-size="14" fill="#5b6b7c">托管 IP：<tspan fill="#334155" font-weight="bold">10.99.0.7 / 24</tspan>　<tspan fill="#5b6b7c">（给节点分一个不冲突的网段）</tspan></text>
    <rect x="700" y="370" width="120" height="34" rx="8" fill="#7a3ff0">
      <animate attributeName="height" values="34;28;34" keyTimes="0;0.88;0.93" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="760" y="393" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">保存 SAVE</text>
    <use href="#cursor">
      <animateTransform attributeName="transform" type="translate" values="428,214; 428,214; 430,220; 748,382; 748,382" keyTimes="0;0.3;0.45;0.8;1" dur="6s" repeatCount="indefinite"/>
    </use>
    <text x="110" y="330" font-size="15" fill="#f0605d" font-weight="bold">⚠ 不勾选 Auth，节点永远连不上！</text>
    <text x="110" y="360" font-size="14" fill="#5b6b7c">建议再点该成员右侧编辑，手动固定一个静态托管 IP，方便以后访问</text>
  </g>

  <!-- ============ 场景 3：客户端加入 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.53;0.73;0.77;1" dur="24s" repeatCount="indefinite"/>
    <circle cx="52" cy="46" r="20" fill="#f6a821"/><text x="52" y="54" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="88" y="54" font-size="21" font-weight="bold" fill="#334155">手机 / 电脑：装 ZeroTier One，加入同一个 ID</text>
    <!-- 手机 -->
    <rect x="120" y="100" width="180" height="330" rx="24" fill="#334155"/>
    <rect x="132" y="118" width="156" height="294" rx="14" fill="#fff"/>
    <circle cx="210" cy="168" r="26" fill="#7a3ff0"/><text x="210" y="176" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Z</text>
    <text x="210" y="216" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Join Network</text>
    <rect x="140" y="232" width="140" height="34" rx="8" fill="#fff" stroke="#9aa7b5" stroke-width="1.6"/>
    <text x="148" y="255" font-size="12.5" font-family="monospace" fill="#334155" clip-path="url(#typeclip3)">a0b1c2d3e4f50607</text>
    <rect x="150" y="286" width="120" height="34" rx="17" fill="#7a3ff0">
      <animate attributeName="height" values="34;28;34" keyTimes="0;0.75;0.8" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="210" y="309" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">JOIN</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.85;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="210" cy="366" r="16" fill="#3ecf6f"/><path d="M202,366 l6,6 l11,-12" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
    <!-- 电脑 -->
    <g transform="translate(430,150)">
      <rect x="0" y="0" width="330" height="200" rx="14" fill="#334155"/>
      <rect x="14" y="14" width="302" height="172" rx="8" fill="#fff"/>
      <circle cx="165" cy="60" r="22" fill="#7a3ff0"/><text x="165" y="67" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Z</text>
      <rect x="65" y="96" width="200" height="30" rx="8" fill="#fff" stroke="#9aa7b5" stroke-width="1.6"/>
      <text x="74" y="117" font-size="13" font-family="monospace" fill="#334155">a0b1c2d3e4f50607</text>
      <rect x="115" y="138" width="100" height="30" rx="15" fill="#7a3ff0"/>
      <text x="165" y="159" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">JOIN</text>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="6s" repeatCount="indefinite"/>
        <circle cx="272" cy="153" r="14" fill="#3ecf6f"/><path d="M265,153 l5,5 l9,-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>
      <path d="M-30,200 h390 l20,26 h-430 Z" fill="#9aa7b5"/>
    </g>
    <text x="595" y="410" font-size="14.5" fill="#5b6b7c" text-anchor="middle">客户端同样要在控制台勾选 Auth 授权</text>
    <!-- 机器人举牌 -->
    <g transform="translate(835,270) scale(0.95)">
      <rect x="-38" y="-20" width="76" height="64" rx="16" fill="#2ba7e8"/>
      <circle cx="-15" cy="6" r="7" fill="#fff"/><circle cx="15" cy="6" r="7" fill="#fff"/>
      <circle cx="-13" cy="7" r="3" fill="#334155"/><circle cx="17" cy="7" r="3" fill="#334155"/>
      <path d="M-12,26 q12,10 24,0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="-38" stroke="#9aa7b5" stroke-width="4"/><circle cx="0" cy="-42" r="6" fill="#3ecf6f"/>
    </g>
  </g>

  <!-- ============ 场景 4：成功使用 ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.73;0.77;1" dur="24s" repeatCount="indefinite"/>
    <circle cx="52" cy="46" r="20" fill="#3ecf6f"/><text x="52" y="54" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="88" y="54" font-size="21" font-weight="bold" fill="#334155">搞定！在外网/4G 也能访问家里一切</text>
    <!-- 连线（流动） -->
    <g stroke="#3ecf6f" stroke-width="4" fill="none" stroke-dasharray="11 9">
      <path d="M210,250 C320,250 350,240 400,240"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.1s" repeatCount="indefinite"/></path>
      <path d="M560,240 C620,240 660,250 740,250"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.1s" repeatCount="indefinite"/></path>
    </g>
    <!-- 中间路由器机器人（得意） -->
    <g transform="translate(480,205)">
      <rect x="-58" y="-24" width="116" height="88" rx="20" fill="#3ecf6f"/>
      <circle cx="-22" cy="6" r="9" fill="#fff"/><circle cx="22" cy="6" r="9" fill="#fff"/>
      <path d="M-20,6 a9,9 0 0 0 18,0" fill="#334155" opacity="0.001"/>
      <circle cx="-20" cy="8" r="4" fill="#334155"/><circle cx="24" cy="8" r="4" fill="#334155"/>
      <path d="M-16,34 q16,14 32,0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-24" x2="0" y2="-48" stroke="#9aa7b5" stroke-width="4"><animate attributeName="x2" values="0;-14;14;0" keyTimes="0;0.3;0.6;1" dur="2s" repeatCount="indefinite"/></line>
      <circle cx="0" cy="-52" r="7" fill="#f6a821"/>
      <rect x="-80" y="80" width="160" height="34" rx="10" fill="#fff" stroke="#3ecf6f" stroke-width="2"/>
      <text x="0" y="103" font-size="14" font-weight="bold" fill="#3ecf6f" text-anchor="middle">旁路由 · ZT 在线</text>
    </g>
    <!-- 左侧：外出的电脑 -->
    <text x="145" y="215" font-size="15" fill="#5b6b7c" text-anchor="middle">外地的你</text>
    <rect x="70" y="230" width="150" height="96" rx="12" fill="#fff" stroke="#9aa7b5" stroke-width="2"/>
    <text x="145" y="270" font-size="13.5" font-family="monospace" fill="#334155" text-anchor="middle">ping 10.99.0.7</text>
    <text x="145" y="296" font-size="13.5" font-family="monospace" fill="#3ecf6f" text-anchor="middle">✓ 23 ms</text>
    <!-- 右侧：家里 NAS -->
    <text x="800" y="215" font-size="15" fill="#5b6b7c" text-anchor="middle">家里设备</text>
    <rect x="740" y="230" width="130" height="96" rx="12" fill="#fff" stroke="#9aa7b5" stroke-width="2"/>
    <rect x="760" y="248" width="90" height="14" rx="4" fill="#f6a821"/><rect x="760" y="270" width="90" height="14" rx="4" fill="#2ba7e8"/>
    <text x="805" y="312" font-size="12.5" fill="#5b6b7c" text-anchor="middle">NAS / 摄像头 / 路由器后台</text>
    <!-- 固件自动说明 -->
    <rect x="90" y="388" width="740" height="100" rx="14" fill="#eefaf2" stroke="#3ecf6f" stroke-width="2"/>
    <text x="460" y="416" font-size="17" font-weight="bold" fill="#1d8a4a" text-anchor="middle">本固件已自动完成（内置，无需手动配置）</text>
    <text x="460" y="443" font-size="14.5" fill="#334155" text-anchor="middle">✓ ZT 随机网卡名 zt* 已并入 lan 防火墙区 —— 远程直接访问内网设备</text>
    <text x="460" y="469" font-size="14.5" fill="#334155" text-anchor="middle">✓ OpenClash UDP 9993 免劫持 —— ZeroTier 打洞直连不掉线</text>
    <!-- 星星 -->
    <text x="330" y="150" font-size="22" fill="#f6a821">✦<animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="640" y="130" font-size="18" fill="#2ba7e8">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></text>
  </g>

  <!-- ============ 底部进度点 ============ -->
  <g>
    <circle cx="422" cy="560" r="9" fill="#d4dbe2"><animate attributeName="fill" values="#f6a821;#f6a821;#d4dbe2;#d4dbe2;#f6a821" keyTimes="0;0.23;0.27;0.95;1" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="458" cy="560" r="9" fill="#d4dbe2"><animate attributeName="fill" values="#d4dbe2;#d4dbe2;#f6a821;#f6a821;#d4dbe2;#d4dbe2" keyTimes="0;0.24;0.28;0.49;0.53;1" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="494" cy="560" r="9" fill="#d4dbe2"><animate attributeName="fill" values="#d4dbe2;#d4dbe2;#f6a821;#f6a821;#d4dbe2;#d4dbe2" keyTimes="0;0.49;0.53;0.73;0.77;1" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="560" r="9" fill="#d4dbe2"><animate attributeName="fill" values="#d4dbe2;#d4dbe2;#f6a821;#f6a821" keyTimes="0;0.73;0.77;1" dur="24s" repeatCount="indefinite"/></circle>
    <text x="700" y="566" font-size="12.5" fill="#8a97a6">GIF 级自动循环 · 共 4 步 · 24 秒</text>
  </g>
</svg>
