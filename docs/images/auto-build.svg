<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f6a821"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b5"/>
    </marker>
  </defs>

  <!-- backdrop card -->
  <rect x="10" y="10" width="1060" height="450" rx="26" fill="#ffffff" stroke="#e8edf3" stroke-width="3"/>

  <!-- ===== scene 1: clock / daily 10:00 ===== -->
  <g transform="translate(115,150)">
    <circle r="62" fill="#fff4dc" stroke="#f6a821" stroke-width="5"/>
    <circle r="62" fill="none" stroke="#f6a821" stroke-width="5" stroke-dasharray="1 14" stroke-linecap="round" opacity=".5"/>
    <!-- clock hands -->
    <line x1="0" y1="0" x2="0" y2="-34" stroke="#f6a821" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="24" y2="10" stroke="#f6a821" stroke-width="6" stroke-linecap="round"/>
    <circle r="5" fill="#f6a821"/>
    <!-- little bell bumps -->
    <circle cx="-40" cy="-52" r="12" fill="#f6a821"/>
    <circle cx="40" cy="-52" r="12" fill="#f6a821"/>
  </g>
  <text x="115" y="258" text-anchor="middle" font-size="24" font-weight="bold" fill="#334155">每天 10:00</text>
  <text x="115" y="288" text-anchor="middle" font-size="18" fill="#8a97a6">闹钟一响，出门巡逻</text>

  <!-- arrow 1 -->
  <path d="M195,150 C240,150 255,150 290,150" fill="none" stroke="#f6a821" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ===== scene 2: robot checking OpenWrt version ===== -->
  <g transform="translate(400,150)">
    <!-- body -->
    <rect x="-52" y="-30" width="104" height="86" rx="20" fill="#e3f4fd" stroke="#2ba7e8" stroke-width="5"/>
    <!-- head -->
    <rect x="-40" y="-84" width="80" height="52" rx="18" fill="#ffffff" stroke="#2ba7e8" stroke-width="5"/>
    <line x1="0" y1="-84" x2="0" y2="-102" stroke="#2ba7e8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-108" r="7" fill="#2ba7e8"/>
    <!-- face -->
    <circle cx="-14" cy="-60" r="6" fill="#2b3a55"/>
    <circle cx="14" cy="-60" r="6" fill="#2b3a55"/>
    <path d="M-10,-46 Q0,-38 10,-46" stroke="#2b3a55" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- fish logo on chest -->
    <g transform="translate(0,14)">
      <ellipse rx="26" ry="14" fill="#2ba7e8"/>
      <path d="M22,0 L38,-11 L38,11 Z" fill="#2ba7e8"/>
      <circle cx="-10" cy="-2" r="3.5" fill="#fff"/>
    </g>
    <!-- magnifier -->
    <circle cx="66" cy="-6" r="20" fill="none" stroke="#f0605d" stroke-width="6"/>
    <line x1="80" y1="8" x2="96" y2="24" stroke="#f0605d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="400" y="258" text-anchor="middle" font-size="24" font-weight="bold" fill="#334155">看看官方出新版了吗</text>
  <text x="400" y="288" text-anchor="middle" font-size="18" fill="#8a97a6">OpenWrt 稳定版 · 每日体检</text>

  <!-- fork labels -->
  <path d="M520,140 C585,120 620,95 668,84" fill="none" stroke="#f6a821" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M512,185 C580,210 615,275 660,300" fill="none" stroke="#9aa7b5" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#arrB)"/>
  <text x="573" y="86" font-size="20" font-weight="bold" fill="#e2711d">有新版！</text>
  <text x="588" y="258" font-size="20" font-weight="bold" fill="#9aa7b5">还没有新版</text>

  <!-- ===== scene 3 upper: hammer build ===== -->
  <g transform="translate(760,84)">
    <!-- anvil block / box -->
    <rect x="-30" y="14" width="72" height="46" rx="8" fill="#fdeef0" stroke="#f0605d" stroke-width="5"/>
    <text x="6" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#f0605d">编译!</text>
    <!-- hammer -->
    <line x1="-34" y1="10" x2="-58" y2="-30" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round"/>
    <rect x="-78" y="-52" width="34" height="20" rx="6" transform="rotate(-30 -61 -42)" fill="#5b6b7c"/>
    <!-- sparks -->
    <g fill="#f6a821">
      <path d="M44,8 l8,-10 M54,20 l12,-4 M40,-2 l4,-12" stroke="#f6a821" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="760" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#334155">抡起小锤，打包固件</text>

  <!-- arrow build -> rocket -->
  <path d="M850,84 C890,84 905,120 930,150" fill="none" stroke="#f6a821" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- ===== scene 4: rocket release ===== -->
  <g transform="translate(960,230)">
    <path d="M0,-84 C26,-52 30,-8 24,34 L-24,34 C-30,-8 -26,-52 0,-84 Z" fill="#e3f4fd" stroke="#2ba7e8" stroke-width="5"/>
    <circle cx="0" cy="-24" r="10" fill="#ffffff" stroke="#2ba7e8" stroke-width="5"/>
    <path d="M-24,10 L-44,44 L-20,34 Z" fill="#f0605d"/>
    <path d="M24,10 L44,44 L20,34 Z" fill="#f0605d"/>
    <!-- flame -->
    <path d="M-14,36 Q0,74 14,36 Q6,48 0,44 Q-6,48 -14,36 Z" fill="#f6a821"/>
    <!-- banner -->
    <g transform="translate(0,96)">
      <rect x="-58" y="-20" width="116" height="38" rx="10" fill="#fff4dc" stroke="#f6a821" stroke-width="4"/>
      <text y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#e2711d">Releases</text>
    </g>
  </g>
  <text x="960" y="404" text-anchor="middle" font-size="18" fill="#8a97a6">发布新固件 🎉</text>

  <!-- ===== scene 3 lower: sleeping robot ===== -->
  <g transform="translate(760,330)">
    <rect x="-60" y="-14" width="120" height="66" rx="18" fill="#eef2f7" stroke="#9aa7b5" stroke-width="5"/>
    <rect x="-44" y="-52" width="88" height="44" rx="16" fill="#ffffff" stroke="#9aa7b5" stroke-width="5"/>
    <!-- closed eyes -->
    <path d="M-22,-30 q6,6 12,0 M10,-30 q6,6 12,0" stroke="#5b6b7c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-8,-16 q8,4 16,0" stroke="#5b6b7c" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- zzz -->
    <text x="62" y="-42" font-size="24" font-weight="bold" fill="#9aa7b5">z</text>
    <text x="78" y="-56" font-size="18" font-weight="bold" fill="#9aa7b5">z</text>
    <text x="90" y="-68" font-size="14" font-weight="bold" fill="#9aa7b5">z</text>
  </g>
  <text x="760" y="416" text-anchor="middle" font-size="18" fill="#8a97a6">回被窝，明天再看</text>
</svg>
